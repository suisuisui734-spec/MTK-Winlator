name: Android build and validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Mali runtime native toolchain
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;35.0.0" "cmake;3.22.1" "ndk;29.0.14206865"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate MTK integration module
        run: |
          gradle testDebugUnitTest
          gradle lintDebug
      - name: Apply MTK integration to Winlator Mali
        run: python3 scripts/integrate_mtk_mali.py
      - name: Build the single integrated MTK Winlator Mali APK
        working-directory: upstream/winlator
        run: gradle :app:assembleStandardDebug
      - name: Upload integrated MTK Winlator Mali APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MTK-Winlator-Mali-integrated-debug
          path: upstream/winlator/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
