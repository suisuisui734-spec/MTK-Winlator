name: Android build and validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Mali runtime native toolchain
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;35.0.0" "cmake;3.22.1" "ndk;29.0.14206865"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile MTK launcher debug APK
        run: gradle assembleDebug
      - name: Run MTK launcher unit tests
        run: gradle testDebugUnitTest
      - name: Run MTK launcher Android lint
        run: gradle lintDebug
      - name: Build Winlator Mali Bionic (ARM64)
        working-directory: upstream/winlator
        run: gradle :app:assembleStandardDebug
      - name: Upload MTK launcher validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MTK-Winlator-launcher-validation
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload Winlator Mali Bionic APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MTK-Winlator-Mali-Bionic-debug
          path: upstream/winlator/app/build/outputs/apk/standard/debug/*.apk
          retention-days: 14
