name: Import Winlator Mali source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Download pinned Winlator Mali source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/GunaCharanTeja/WinlatorMali.git /tmp/winlator-mali
          git -C /tmp/winlator-mali checkout 0411a4b602ed00d71bef52e6a7ccb82a8e709b1a

      - name: Replace repository contents with upstream source
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/workflows/import-winlator-mali.yml' \
            /tmp/winlator-mali/ ./

      - name: Commit and push imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "Import complete Winlator Mali source"
          git push origin HEAD:main
